<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R&R 정리판 · 업무 현황판</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">R</span><div><strong>R&R 정리판</strong><small>교육 대표 · 파도형</small></div></div>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav" aria-label="주 메뉴">
        <button class="nav-item active" data-view="dashboard"><span>▦</span>현황판</button>
        <button class="nav-item" data-view="tasks"><span>✓</span>업무 항목 <b id="navTaskCount">0</b></button>
        <button class="nav-item" data-view="team"><span>♙</span>팀원 프로필</button>
        <button class="nav-item" data-view="records"><span>◒</span>KPI 기록</button>
        <button class="nav-item" data-view="admin"><span>⚙</span>관리자</button>
      </nav>
      <div class="sidebar-bottom"><span class="sync-dot"></span><span id="syncStatus">로컬 기록으로 동작 중</span><button id="resetData" title="샘플 데이터로 초기화">↺</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div class="breadcrumb">교육 대표 <span>/</span> <strong id="pageTitle">현황판</strong></div><div class="top-actions"><div class="live-users"><span class="pulse"></span><b id="participantCount">6</b>명 참여 중</div><button class="icon-btn" title="알림">♢</button><button class="avatar" id="profileBtn" title="내 프로필">김</button></div></header>
      <div id="app"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
